<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="wf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="gs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aaaaaa"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
  </defs>

  <rect width="400" height="560" fill="#0a0a0a"/>

  <!-- ═══ TOP B (bumps point RIGHT) ═══ -->
  <!-- Left outer shadow face (left hex side of top B) -->
  <polygon points="90,140  160,60  160,140" fill="url(#gs)"/>
  <polygon points="90,140  90,280  160,280  160,140" fill="url(#gd)"/>

  <!-- Top B front face (white) — hexagon outline shape -->
  <!-- Outer border of top B: top-left→top-right→upper-bump-tip→mid-right→lower-bump-tip→bottom-right→bottom-left -->
  <polygon points="160,60  310,60  310,135  350,175  310,215  310,280  160,280" fill="url(#wf)"/>

  <!-- Cutout triangles (negative space that creates the B bumps) -->
  <!-- Upper triangle cutout -->
  <polygon points="195,75  300,75  300,135  260,135  195,100" fill="#0a0a0a"/>
  <!-- Lower triangle cutout -->
  <polygon points="195,175  260,175  300,215  300,265  195,265" fill="#0a0a0a"/>

  <!-- Vertical spine white bar (shared center line) -->
  <rect x="160" y="60" width="35" height="440" fill="url(#wf)"/>

  <!-- ═══ BOTTOM B (bumps point LEFT, 180° rotation of top B) ═══ -->
  <!-- Right outer shadow face -->
  <polygon points="310,280  240,360  240,280" fill="url(#gs)"/>
  <polygon points="310,280  310,420  240,420  240,280" fill="url(#gd)"/>

  <!-- Bottom shadow face below -->
  <polygon points="310,420  240,500  160,500  90,420  90,280  160,280  160,420" fill="url(#gd)"/>

  <!-- Bottom B front face (white) — mirror of top -->
  <polygon points="240,280  90,280  90,355  50,395  90,435  90,500  240,500" fill="url(#wf)"/>

  <!-- Upper triangle cutout bottom B -->
  <polygon points="205,295  100,295  100,355  140,355  205,320" fill="#0a0a0a"/>
  <!-- Lower triangle cutout bottom B -->
  <polygon points="205,395  140,395  100,435  100,485  205,485" fill="#0a0a0a"/>

  <!-- Shadow on top B right (right side faces of the B bumps) -->
  <polygon points="310,60  350,100  350,175  310,135" fill="url(#gs)"/>
  <polygon points="310,215  350,175  350,250  310,280" fill="url(#gd)"/>

  <!-- Shadow on bottom B left -->
  <polygon points="90,280  50,320  50,395  90,355" fill="url(#gs)"/>
  <polygon points="90,435  50,395  50,460  90,500" fill="url(#gd)"/>

  <!-- Center fold crease shadow -->
  <rect x="90" y="272" width="220" height="16" fill="rgba(0,0,0,0.45)" rx="2"/>
</svg>
